# Color controls plus Milestone 2 lighting/debug options.
screen = DEBUG_VIEW SHADOWS_ENABLED SHADOW_BIAS SHADOW_FILTER SHADOW_SOFTNESS LIGHTING_STRENGTH AMBIENT_LIGHT DIRECT_LIGHT EXPOSURE SATURATION CONTRAST TEMPERATURE TINT GRAYSCALE
screen.columns = 2
sliders = SHADOW_SOFTNESS SHADOW_BIAS LIGHTING_STRENGTH AMBIENT_LIGHT DIRECT_LIGHT EXPOSURE SATURATION CONTRAST TEMPERATURE TINT

# Data attachments must not alpha-blend encoded normals or light levels.
blend.gbuffers_terrain.colortex1 = off
blend.gbuffers_terrain.colortex2 = off
blend.gbuffers_block.colortex1 = off
blend.gbuffers_block.colortex2 = off
blend.gbuffers_entities.colortex1 = off
blend.gbuffers_entities.colortex2 = off

# Milestone 3A caster scope: terrain/cutouts and block entities only.
shadowTerrain = true
shadowTranslucent = false
shadowEntities = false
shadowPlayer = false
shadowBlockEntities = true
