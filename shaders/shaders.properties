# Color controls plus Milestone 2 lighting/debug options.
screen = <profile> <empty> [ATMOSPHERE] [SHADOWS] [WATER] [CLOUDS] [AURORA] [BLOOM] [FOG] [COLOR] [ADVANCED] [FOLIAGE]
screen.columns = 2
sliders = WATER_CAUSTICS_STRENGTH WATER_CLARITY SUN_GLOW_STRENGTH MOON_GLOW_STRENGTH FOLIAGE_WIND_STRENGTH WATER_DEPTH_STRENGTH WATER_DEPTH_SCALE WATER_WAVE_STRENGTH WATER_TINT_STRENGTH WATER_REFLECTION_STRENGTH CLOUD_COLOR_STRENGTH AURORA_INTENSITY BLOOM_STRENGTH BLOOM_THRESHOLD BLOOM_SOFT_KNEE FOG_DENSITY FOG_START FOG_BASE_HEIGHT FOG_HEIGHT_FALLOFF FOG_RAIN_BOOST TONEMAP_KNEE SKY_BLEND SUNSET_GLOW NIGHT_BRIGHTNESS LIGHT_PALETTE_STRENGTH SHADOW_SOFTNESS SHADOW_BIAS SHADOW_BIAS_MIN SHADOW_BIAS_MAX LIGHTING_STRENGTH AMBIENT_LIGHT DIRECT_LIGHT EXPOSURE SATURATION CONTRAST TEMPERATURE TINT

iris.features.optional = PER_BUFFER_BLENDING

#ifdef IRIS_FEATURE_PER_BUFFER_BLENDING
# Data attachments must not alpha-blend encoded normals or light levels.
blend.gbuffers_terrain.colortex1 = off
blend.gbuffers_terrain.colortex2 = off
blend.gbuffers_block.colortex1 = off
blend.gbuffers_block.colortex2 = off
blend.gbuffers_entities.colortex1 = off
blend.gbuffers_entities.colortex2 = off
#endif

# Milestone 3A caster scope: terrain/cutouts and block entities only.
shadowTerrain = true
#if defined(IRIS_FEATURE_PER_BUFFER_BLENDING) && defined(SHADOWS_ENABLED) && WATER_OPTICS == 1 && WATER_CAUSTICS == 1 && SCENE_COLOR_MODE == 1 && DEBUG_VIEW == 0 && WATER_STYLE == 1
shadowTranslucent = true
blend.shadow = off
#else
shadowTranslucent = false
#endif
shadowEntities = false
shadowPlayer = false
shadowBlockEntities = true

# M7 fantasy styling; legacy controls retain their existing names.
screen.ATMOSPHERE = SKY_STYLE SKY_BLEND SUNSET_GLOW NIGHT_BRIGHTNESS LIGHT_PALETTE LIGHT_PALETTE_STRENGTH LIGHTING_STRENGTH AMBIENT_LIGHT DIRECT_LIGHT CELESTIAL_GLOW SUN_GLOW_STRENGTH MOON_GLOW_STRENGTH
screen.ATMOSPHERE.columns = 2

# M8 scene storage/compositing and display mapping.
screen.COLOR_PIPELINE = SCENE_COLOR_MODE TONE_MAPPING TONEMAP_KNEE
screen.COLOR_PIPELINE.columns = 2

# M9 fog scope depends on particles being drawn after deferred lighting.
particles.ordering = after
screen.FOG = FOG_ENABLED FOG_DENSITY FOG_START FOG_BASE_HEIGHT FOG_HEIGHT_FALLOFF FOG_RAIN_BOOST
screen.FOG.columns = 2

# M10 bloom scratch attachments: actual half resolution, default per-pass flips.
size.buffer.colortex3 = 0.5 0.5
size.buffer.colortex4 = 0.5 0.5
screen.BLOOM = BLOOM_ENABLED BLOOM_STRENGTH BLOOM_THRESHOLD BLOOM_SOFT_KNEE
screen.BLOOM.columns = 2

# M11 sky-only procedural aurora; original sky objects and fog palette stay separate.
screen.AURORA = AURORA_ENABLED AURORA_INTENSITY AURORA_SPEED
screen.AURORA.columns = 2

# M12 native cloud source styling and per-fragment fog; no cloud mesh replacement.
screen.CLOUDS = CLOUD_STYLE CLOUD_COLOR_STRENGTH CLOUD_FOG
screen.CLOUDS.columns = 2

# M13 classified vanilla water, source RGB only; native alpha and late fog remain.
screen.WATER = WATER_STYLE WATER_OPTICS WATER_CLARITY WATER_REFRACTION WATER_FOAM WATER_CAUSTICS WATER_CAUSTICS_STRENGTH WATER_CELESTIAL_GLINT WATER_FLOW WATER_INTERACTIONS WATER_TINT_STRENGTH WATER_REFLECTION_STRENGTH WATER_SCREEN_REFLECTIONS WATER_REFLECTION_STEPS WATER_TRACE_TILES WATER_WAVES WATER_SURFACE_DETAIL WATER_WAVE_STRENGTH WATER_WAVE_SPEED WATER_DEPTH_TINT WATER_DEPTH_STRENGTH WATER_DEPTH_SCALE
screen.WATER.columns = 2

# M18 adds foliage wind to the six M17 quality controls; artistic strengths remain.
# All profiles keep shadows enabled. Bloom-off retains its four passes and buffers.
profile.BALANCED = SHADOWS_ENABLED SHADOW_FILTER=1 BLOOM_ENABLED=1 AURORA_ENABLED=1 WATER_WAVES=1 WATER_DEPTH_TINT=1 FOLIAGE_WIND=1
profile.LIGHT = profile.BALANCED SHADOW_FILTER=0 BLOOM_ENABLED=0 AURORA_ENABLED=0 WATER_WAVES=0 WATER_DEPTH_TINT=0 FOLIAGE_WIND=0
profile.SOFT_SHADOWS = profile.BALANCED SHADOW_FILTER=2

# M17 groups existing controls without changing any shader defaults.
screen.SHADOWS = SHADOWS_ENABLED SHADOW_FILTER SHADOW_SOFTNESS SHADOW_BIAS_MODE SHADOW_BIAS SHADOW_BIAS_MIN SHADOW_BIAS_MAX
screen.SHADOWS.columns = 2
screen.COLOR = EXPOSURE SATURATION CONTRAST TEMPERATURE TINT GRAYSCALE
screen.COLOR.columns = 2
screen.ADVANCED = DEBUG_VIEW [COLOR_PIPELINE]
screen.ADVANCED.columns = 2

# M18: identical wind for terrain and its shadow casters; no new passes or textures.
screen.FOLIAGE = FOLIAGE_WIND FOLIAGE_WIND_STRENGTH FOLIAGE_WIND_SPEED
screen.FOLIAGE.columns = 2

#ifdef IRIS_FEATURE_PER_BUFFER_BLENDING
# Water M0 diagnostics: metadata must not alpha-blend; scene color keeps native blending.
#if DEBUG_VIEW == 7 || DEBUG_VIEW == 8 || DEBUG_VIEW == 9
blend.gbuffers_water.colortex7 = off
#endif

# A visible second surface or overlay invalidates optical replacement in either draw order.
#if WATER_OPTICS == 1 && WATER_STYLE == 1 && SCENE_COLOR_MODE == 1 && DEBUG_VIEW == 0
blend.gbuffers_water.colortex7 = off
blend.gbuffers_armor_glint.colortex8 = ONE ONE ONE ONE
blend.gbuffers_basic.colortex8 = ONE ONE ONE ONE
blend.gbuffers_beaconbeam.colortex8 = ONE ONE ONE ONE
blend.gbuffers_block.colortex8 = off
blend.gbuffers_clouds.colortex8 = ONE ONE ONE ONE
blend.gbuffers_entities.colortex8 = off
blend.gbuffers_hand.colortex8 = ONE ONE ONE ONE
blend.gbuffers_hand_water.colortex8 = ONE ONE ONE ONE
blend.gbuffers_skybasic.colortex8 = ONE ONE ONE ONE
blend.gbuffers_skytextured.colortex8 = ONE ONE ONE ONE
blend.gbuffers_spidereyes.colortex8 = ONE ONE ONE ONE
blend.gbuffers_terrain.colortex8 = off
blend.gbuffers_textured.colortex8 = ONE ONE ONE ONE
blend.gbuffers_textured_lit.colortex8 = ONE ONE ONE ONE
blend.gbuffers_water.colortex8 = ONE ONE ONE ONE
blend.gbuffers_weather.colortex8 = ONE ONE ONE ONE
#else
program.composite.enabled = false
#endif
#else
program.composite.enabled = false
#endif

#ifdef IRIS_FEATURE_PER_BUFFER_BLENDING
#if WATER_OPTICS == 1 && WATER_STYLE == 1 && SCENE_COLOR_MODE == 1 && DEBUG_VIEW == 0 && WATER_TRACE_TILES == 1 && WATER_SCREEN_REFLECTIONS == 1
size.buffer.colortex10 = 0.125 0.125
#else
program.deferred1.enabled = false
#endif
#else
program.deferred1.enabled = false
#endif

#ifdef IRIS_FEATURE_PER_BUFFER_BLENDING
#if WATER_OPTICS == 1 && WATER_STYLE == 1 && SCENE_COLOR_MODE == 1 && DEBUG_VIEW == 0 && WATER_INTERACTIONS == 1 && WATER_SURFACE_DETAIL == 1
size.buffer.colortex15 = 16 2
#else
program.prepare1.enabled = false
#endif
#else
program.prepare1.enabled = false
#endif
